<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Login - Guardalink</title>

    <!-- FONT -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="login.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

    <!-- HEADER -->
    <header class="header">

      <div class="container">

        <a href="index.html" class="logo">

          <img
            src="logo.png (2).png"
            width="70"
            alt="Logo"
          />

          <span class="logo-text">
            Guardalink
          </span>

        </a>

      </div>

    </header>

    <!-- LOGIN -->
    <main class="main-login">

      <div class="login-container">

        <h1>Entrar</h1>

        <form id="loginForm">

          <!-- EMAIL -->
          <div class="input-group">

            <input
              type="email"
              id="email"
              placeholder="Email"
              required
            autocomplete="off"/>

          </div>

          <!-- SENHA -->
          <div class="input-group">

            <div class="password-wrapper">

              <input
                type="password"
                id="senha"
                placeholder="Senha"
                minlength="6"
                required
              />

              <button
                type="button"
                class="toggle-password"
                onclick="togglePassword('senha', this)"
              >
                <i class="fa-solid fa-eye"></i>
              </button>

            </div>

          </div>

          <!-- ESQUECI SENHA -->
          <a href="#" class="forgot-password">
            Esqueci minha senha
          </a>

          <!-- BOTÃO -->
          <button
            type="submit"
            class="btn-login"
          >
            Entrar
          </button>

        </form>

        <!-- MENSAGEM -->
        <div id="mensagem"></div>

        <!-- FOOTER LOGIN -->
        <div class="login-footer">

          <p>
            Não tem conta?

            <a href="cadastro.html">
              Criar conta
            </a>
          </p>

        </div>

      </div>

    </main>

    <!-- MODAL -->
    <div id="forgotModal" class="modal">

      <div class="modal-content">

        <span class="close">
          &times;
        </span>

        <h2>Esqueci minha senha</h2>

        <p>
          Digite seu e-mail para recuperação.
        </p>

        <form id="forgotForm">

          <input
            type="email"
            id="resetEmail"
            placeholder="E-mail"
            required
            autocomplete="off"
          />

          <button
            type="submit"
            class="btn-reset"
          >
            Enviar recuperação
          </button>

        </form>

        <div id="resetMessage"></div>

      </div>

    </div>

   

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- LOGIN JS -->
    <script src="login.js"></script>

  </body>
</html>
